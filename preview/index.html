<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>salesforce-mcp-app card preview</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #1f2328; background: #f6f7f9; display: grid; grid-template-columns: 260px 1fr; height: 100vh; }
  nav { border-right: 1px solid #e3e5e8; background: #fff; overflow-y: auto; padding: 12px 0; }
  nav h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #6a737d; margin: 14px 16px 4px; }
  nav button { display: block; width: 100%; text-align: left; border: 0; background: none; font: inherit; padding: 5px 16px; cursor: pointer; color: inherit; }
  nav button:hover { background: #f1f3f5; }
  nav button.active { background: #e8f0fe; color: #0b57d0; font-weight: 600; }
  main { overflow-y: auto; display: flex; flex-direction: column; }
  .toolbar { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; padding: 10px 20px; background: #fff; border-bottom: 1px solid #e3e5e8; }
  .seg { display: inline-flex; border: 1px solid #d0d4d9; border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; background: #fff; font: inherit; padding: 3px 10px; cursor: pointer; }
  .seg button + button { border-left: 1px solid #d0d4d9; }
  .seg button.on { background: #1f2328; color: #fff; }
  label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .muted { color: #6a737d; }
  .stage { padding: 24px 20px 40px; display: flex; flex-direction: column; gap: 20px; align-items: center; }
  .stage > * { max-width: var(--card-width, 560px); }
  .chat { width: 100%; display: flex; flex-direction: column; gap: 8px; }
  .bubble { align-self: flex-start; max-width: 100%; background: #fff; border: 1px solid #e3e5e8; border-radius: 10px; padding: 8px 12px; color: #444; }
  iframe { display: block; width: 100%; border: 0; height: 60px; background: transparent; }
  .panel { width: 100%; background: #fff; border: 1px solid #e3e5e8; border-radius: 8px; }
  .panel h3 { margin: 0; font-size: 12px; padding: 8px 12px; border-bottom: 1px solid #e3e5e8; display: flex; justify-content: space-between; }
  .panel pre { margin: 0; padding: 10px 12px; white-space: pre-wrap; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; max-height: 260px; overflow: auto; }
</style>
</head>
<body>
<nav id="fixtures"></nav>
<main>
  <div class="toolbar">
    <span class="seg" id="widths"></span>
    <span class="seg" id="modes"></span>
    <label><input type="checkbox" id="cap-message"> Host can post to chat</label>
    <label><input type="checkbox" id="cap-links"> Host can open links</label>
    <span class="muted" id="status"></span>
  </div>
  <div class="stage">
    <div class="chat" id="chat">
      <div class="bubble" id="caption"></div>
      <div id="frame-slot"></div>
    </div>
    <div class="panel"><h3>Text fallback <span class="muted">what chat clients without MCP Apps show</span></h3><pre id="text"></pre></div>
    <div class="panel"><h3>Host log <span class="muted">messages from the card</span></h3><pre id="log"></pre></div>
  </div>
</main>
<script type="module" src="./host.js"></script>
</body>
</html>
